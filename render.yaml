services:
  - name: gefin-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: DEPLOYMENT_ENV
        value: production
      - key: CATALOG_PATH
        value: /app/catalog/metrics.yaml
      - key: FABRIC_CATALOG_PATH
        value: /app/catalog/fabric_metrics.yaml
      - key: MCP_SERVER_URL
        value: https://mcp-fabric-dck4.onrender.com/mcp
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: MCP_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_AGENT_STEPS
        value: "6"
      - key: SQL_ROW_LIMIT
        value: "500"
      - key: SQL_TIMEOUT_SECONDS
        value: "30"
